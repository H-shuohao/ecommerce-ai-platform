groups:
  - name: ai-core-availability-and-performance
    rules:
      - alert: AIServiceDown
        expr: up{job="ai-core"} == 0
        for: 30s
        labels:
          severity: critical
          service: ai-core
        annotations:
          summary: AI Core 服务不可用
          description: Prometheus 已连续 30 秒无法采集 AI Core 指标。

      - alert: AIHighServerErrorRate
        expr: |
          (
            sum(rate(ai_core_http_requests_total{status_code=~"5.."}[2m]))
            /
            clamp_min(sum(rate(ai_core_http_requests_total[2m])), 0.000001)
          ) > 0.05
          and
          sum(rate(ai_core_http_requests_total[2m])) > 0
        for: 2m
        labels:
          severity: warning
          service: ai-core
        annotations:
          summary: AI Core 的 5xx 错误率过高
          description: 最近两分钟的服务端错误率持续高于 5%。

      - alert: AIHighP95Latency
        expr: ai_core_http_request_duration_ms{quantile="0.95"} > 5000
        for: 3m
        labels:
          severity: warning
          service: ai-core
        annotations:
          summary: AI Core 的 P95 延迟过高
          description: P95 请求延迟已持续三分钟高于 5000 毫秒。
